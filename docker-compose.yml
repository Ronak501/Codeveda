services:
  mongo:
    image: mongo:7
    container_name: codeveda-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codeveda-backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      PORT: 3000
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/codeveda
      JWT_SECRET: change_this_in_real_deployment
      JWT_EXPIRES_IN: 1d
      CLIENT_ORIGIN: http://localhost:8080
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: codeveda-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mongo_data:
